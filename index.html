<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Voltline — Electric Dirt Bike Sandbox</title>
    <meta name="description" content="Build, tune and ride original electric dirt bikes in a 3D sandbox. Works offline." />
    <meta name="theme-color" content="#0d0f13" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voltline" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html,body{margin:0;height:100%;background:#0d0f13;color:#eef0f3;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
      #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;transition:opacity .3s}
      #boot .logo{font-size:44px;font-weight:900;font-style:italic;letter-spacing:-.02em}
      #boot .logo span{color:#c6f432}
      #boot .bar{width:200px;height:4px;border-radius:2px;background:#222833;overflow:hidden}
      #boot .bar i{display:block;height:100%;width:30%;background:#c6f432;animation:load 1.1s ease-in-out infinite alternate}
      #boot .msg{color:#9aa3b1;font-size:13px;max-width:80vw;text-align:center}
      @keyframes load{from{transform:translateX(-60%)}to{transform:translateX(260%)}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div class="logo">VOLT<span>LINE</span></div><div class="bar"><i></i></div><div class="msg" id="boot-msg">Building the world…</div></div>
    <noscript>Voltline needs JavaScript and WebGL.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
